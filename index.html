<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030b18"><title>Interface</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at center,#0b2945,#020611 72%);color:#bdefff;font:14px system-ui}.app{height:100dvh;max-width:460px;margin:auto;display:flex;flex-direction:column;padding:22px}.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}.orb{width:68vw;height:68vw;max-width:300px;max-height:300px;border-radius:50%;border:1px solid #4dcfff;background:radial-gradient(circle at 38% 30%,#d9ffff,#3bc7f5 9%,#115a9b 28%,#061b32 60%,#020915 75%);box-shadow:0 0 30px #21baffaa,0 0 95px #1378d666,inset 0 0 30px #8feeff;animation:pulse 3s ease-in-out infinite;cursor:pointer}.orb.on{animation:pulse .7s ease-in-out infinite}.wave{display:flex;align-items:center;justify-content:center;gap:4px;height:70px;margin-top:25px}.wave i{width:3px;height:var(--h);background:#4ed8ff;border-radius:4px;animation:w 1.5s ease-in-out infinite;animation-delay:var(--d)}nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #1d4e70;padding-top:12px}nav button{border:0;background:none;color:#9ac7dd;padding:12px 0;font:12px system-ui}nav button.sel{color:#7feaff;background:#0b2a43;border-radius:10px}.panel{display:none;flex:1;align-content:center;text-align:center;padding:20px}.panel.active{display:grid}.box{padding:25px;border:1px solid #205273;border-radius:14px;background:#091a2c}.note{text-align:center;font-size:10px;color:#618ca6;letter-spacing:.1em;min-height:22px}@keyframes pulse{50%{transform:scale(1.04);filter:brightness(1.3)}}@keyframes w{50%{height:4px;opacity:.45}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><div class="app"><div class="note">DÉMONSTRATION · NON CONNECTÉE</div><main id="voice" class="stage"><button class="orb" aria-label="Tester l'orbe" onclick="this.classList.toggle('on')"></button><div class="wave" id="wave"></div></main><section class="panel" id="chat"><div class="box">Conversation textuelle<br><br>Connexion non configurée</div></section><section class="panel" id="memory"><div class="box">Mémoire<br><br>Aucune donnée personnelle chargée</div></section><section class="panel" id="system"><div class="box">Système<br><br>Microphone inactif<br>ASUS non connecté<br>Aucun appel API</div></section><nav><button class="sel" onclick="tab('voice',this)">◉<br>Voix</button><button onclick="tab('chat',this)">▤<br>Chat</button><button onclick="tab('memory',this)">◎<br>Mémoire</button><button onclick="tab('system',this)">⚙<br>Système</button></nav></div><script>for(let i=0;i<39;i++){let b=document.createElement('i');b.style.setProperty('--h',(6+34*Math.sin(Math.PI*i/39)**2*Math.abs(Math.cos(i*1.9)))+'px');b.style.setProperty('--d',(-i*.06)+'s');wave.append(b)}function tab(id,b){for(let x of document.querySelectorAll('main,section')){x.style.display=x.id===id?(id==='voice'?'flex':'grid'):'none'}for(let x of document.querySelectorAll('nav button'))x.classList.remove('sel');b.classList.add('sel')}</script></html>
